<svg fill="none" viewBox="0 0 900 1340" width="100%" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        /* Cyberpunk Smooth Glow & Translation Animations */
        @keyframes pulseGlow {
          0% { box-shadow: 0 0 8px rgba(211, 19, 114, 0.15); }
          50% { box-shadow: 0 0 22px rgba(211, 19, 114, 0.45); border-color: #ff63b4; }
          100% { box-shadow: 0 0 8px rgba(211, 19, 114, 0.15); }
        }

        @keyframes titleGlow {
          0% { text-shadow: 0 0 8px rgba(211, 19, 114, 0.3); }
          50% { text-shadow: 0 0 20px rgba(211, 19, 114, 0.7), 0 0 30px rgba(211, 19, 114, 0.3); color: #ffffff; }
          100% { text-shadow: 0 0 8px rgba(211, 19, 114, 0.3); }
        }

        @keyframes cardShimmer {
          0% { border-color: #1f223d; box-shadow: none; }
          50% { border-color: #ff63b4; box-shadow: 0 0 15px rgba(211, 19, 114, 0.2); }
          100% { border-color: #1f223d; box-shadow: none; }
        }

        .container {
          background-color: #0d0e15;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
          color: #ffffff;
          padding: 30px;
          box-sizing: border-box;
          border-radius: 12px;
          border: 1px solid #1f2030;
          height: 1340px;
        }

        /* Top Navigation Header Link Buttons */
        .nav-bar {
          display: flex;
          gap: 12px;
          margin-bottom: 30px;
          flex-wrap: wrap;
        }
        .nav-btn {
          display: flex;
          align-items: center;
          gap: 8px;
          border: 1.5px solid #d31372;
          background: rgba(211, 19, 114, 0.05);
          color: #ff63b4;
          padding: 8px 18px;
          border-radius: 8px;
          font-size: 14px;
          font-weight: 600;
          letter-spacing: 0.5px;
          transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .nav-btn img {
          width: 16px;
          height: 16px;
          filter: invert(32%) sepia(91%) saturate(3015%) hue-rotate(314deg) brightness(98%) contrast(101%);
          transition: all 0.3s ease;
        }
        .nav-btn:hover {
          background: rgba(211, 19, 114, 0.2);
          transform: translateY(-2px);
          box-shadow: 0 0 15px #d31372;
          color: #ffffff;
        }
        .nav-btn:hover img {
          filter: invert(100%) sepia(100%) saturate(0%) hue-rotate(288deg) brightness(102%) contrast(102%);
        }

        /* Banner Block Content Segment */
        .hero {
          background: linear-gradient(135deg, #161224 0%, #0d0e15 100%);
          border: 1px solid #2d1230;
          padding: 35px;
          border-radius: 12px;
          margin-bottom: 35px;
          animation: pulseGlow 6s infinite ease-in-out;
        }

        .status-badge {
          display: inline-block;
          background: rgba(0, 230, 118, 0.1);
          border: 1px solid #00e676;
          color: #00e676;
          padding: 4px 12px;
          border-radius: 20px;
          font-size: 12px;
          font-weight: 600;
          margin-bottom: 18px;
          text-transform: uppercase;
          letter-spacing: 0.5px;
        }

        h1 {
          font-size: 36px;
          margin: 0 0 12px 0;
          font-weight: 800;
        }
        h1 span { 
          color: #ff63b4; 
          animation: titleGlow 4s infinite ease-in-out;
        }
        
        .tagline {
          color: #9fa4dd;
          font-size: 18px;
          margin: 0 0 15px 0;
          font-weight: 500;
        }
        .desc {
          color: #b4b9e6;
          font-size: 14px;
          line-height: 1.6;
          margin: 0;
        }

        /* Sector Headers */
        .section-header {
          font-size: 18px;
          font-weight: 700;
          color: #ff63b4;
          margin: 10px 0 20px 0;
          border-bottom: 1px solid #2d1230;
          padding-bottom: 8px;
          text-transform: uppercase;
          letter-spacing: 1px;
        }

        /* Real Icon-Driven Skill Layout Matrix */
        .skills-matrix {
          display: grid;
          grid-template-columns: repeat(2, 1fr);
          gap: 20px;
        }
        
        .skill-category-card {
          background: #11121a;
          border: 1px solid #1f223d;
          padding: 22px;
          border-radius: 10px;
          animation: cardShimmer 6s infinite ease-in-out;
        }
        .skill-category-card:nth-child(2) { animation-delay: 1.5s; }
        .skill-category-card:nth-child(3) { animation-delay: 3s; }
        .skill-category-card:nth-child(4) { animation-delay: 4.5s; }

        .category-title {
          font-size: 14px;
          font-weight: 700;
          color: #ffffff;
          margin-bottom: 16px;
          text-transform: uppercase;
          letter-spacing: 0.5px;
        }

        .badge-list {
          display: flex;
          flex-wrap: wrap;
          gap: 8px;
        }

        /* Clean Real-Icon Badge Architecture */
        .tech-badge {
          display: flex;
          align-items: center;
          gap: 8px;
          background: #181926;
          border: 1px solid #252844;
          padding: 8px 14px;
          border-radius: 6px;
          font-family: -apple-system, BlinkMacSystemFont, sans-serif;
          font-size: 13px;
          font-weight: 600;
          color: #b4b9e6;
          transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .tech-badge img {
          width: 16px;
          height: 16px;
          object-fit: contain;
        }
        
        /* Interactive State: Changes background, text, border color and adds intense glow */
        .tech-badge:hover {
          transform: translateY(-4px);
          color: #ffffff;
          border-color: #ff63b4;
          background: rgba(211, 19, 114, 0.1);
          box-shadow: 0 0 15px rgba(211, 19, 114, 0.4);
        }
      </style>

      <div class="container">
        <div class="nav-bar">
          <div class="nav-btn">
            <img src="https://cdn.simpleicons.org/browser" alt="Portfolio"/>
            Portfolio Website
          </div>
          <div class="nav-btn">
            <img src="https://cdn.simpleicons.org/linkedin" alt="LinkedIn"/>
            LinkedIn Profile
          </div>
          <div class="nav-btn">
            <img src="https://cdn.simpleicons.org/gmail" alt="Email"/>
            Email Inbox
          </div>
        </div>

        <div class="hero">
          <div class="status-badge">Available for Internship &amp; Opportunities</div>
          <h1>Hello, I'm <span>Amara THORNG</span></h1>
          <div class="tagline">Information &amp; Communication Technology Student — Software Engineering</div>
          <p class="desc">I engineer clean, high-performance web backends, complex data pipelines, and optimized cloud architectures. Focused on scalability, system integrity, and real-world implementation metrics.</p>
        </div>

        <div class="section-header">Technical Highlight Ecosystem</div>

        <div class="skills-matrix">
          
          <div class="skill-category-card">
            <div class="category-title">Languages &amp; Presentation</div>
            <div class="badge-list">
              <div class="tech-badge">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/java/java-original.svg" alt="Java"/>
                Java
              </div>
              <div class="tech-badge">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/html5/html5-original.svg" alt="HTML5"/>
                HTML5
              </div>
              <div class="tech-badge">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/javascript/javascript-original.svg" alt="JavaScript"/>
                JavaScript
              </div>
              <div class="tech-badge">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/typescript/typescript-original.svg" alt="TypeScript"/>
                TypeScript
              </div>
              <div class="tech-badge">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/python/python-original.svg" alt="Python"/>
                Python
              </div>
              <div class="tech-badge">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/tailwindcss/tailwindcss-original.svg" alt="TailwindCSS"/>
                TailwindCSS
              </div>
              <div class="tech-badge">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/figma/figma-original.svg" alt="Figma"/>
                Figma
              </div>
            </div>
          </div>

          <div class="skill-category-card">
            <div class="category-title">Frameworks &amp; Runtimes</div>
            <div class="badge-list">
              <div class="tech-badge">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/express/express-original.svg" style="filter: invert(100%)" alt="Express.js"/>
                Express.js
              </div>
              <div class="tech-badge">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/fastapi/fastapi-original.svg" alt="FastAPI"/>
                FastAPI
              </div>
              <div class="tech-badge">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/flask/flask-original.svg" style="filter: invert(100%)" alt="Flask"/>
                Flask
              </div>
              <div class="tech-badge">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/django/django-plain.svg" style="filter: invert(45%) sepia(34%) saturate(933%) hue-rotate(110deg) brightness(93%) contrast(98%)" alt="Django"/>
                Django
              </div>
              <div class="tech-badge">
                <img src="https://cdn.simpleicons.org/jwt/d63aff" alt="JWT"/>
                JWT
              </div>
              <div class="tech-badge">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/nodejs/nodejs-original.svg" alt="Node.js"/>
                Node.js
              </div>
              <div class="tech-badge">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/nextjs/nextjs-original.svg" style="filter: invert(100%)" alt="Next.js"/>
                Next.js
              </div>
              <div class="tech-badge">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/npm/npm-original-wordmark.svg" alt="NPM"/>
                NPM
              </div>
              <div class="tech-badge">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/react/react-original.svg" alt="React"/>
                React
              </div>
            </div>
          </div>

          <div class="skill-category-card">
            <div class="category-title">Databases &amp; Adapters</div>
            <div class="badge-list">
              <div class="tech-badge">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/postgresql/postgresql-original.svg" alt="PostgreSQL"/>
                PostgreSQL
              </div>
              <div class="tech-badge">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/supabase/supabase-original.svg" alt="Supabase"/>
                Supabase
              </div>
              <div class="tech-badge">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/mongodb/mongodb-original.svg" alt="MongoDB"/>
                MongoDB
              </div>
              <div class="tech-badge">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/mysql/mysql-original.svg" alt="MySQL"/>
                MySQL
              </div>
              <div class="tech-badge">
                <img src="https://cdn.simpleicons.org/prisma/ffffff" alt="Prisma"/>
                Prisma
              </div>
            </div>
          </div>

          <div class="skill-category-card">
            <div class="category-title">Data Science &amp; Pipelines</div>
            <div class="badge-list">
              <div class="tech-badge">
                <img src="https://cdn.simpleicons.org/matplotlib/11557c" alt="Matplotlib"/>
                Matplotlib
              </div>
              <div class="tech-badge">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/numpy/numpy-original.svg" alt="NumPy"/>
                NumPy
              </div>
              <div class="tech-badge">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/pandas/pandas-original.svg" alt="Pandas"/>
                Pandas
              </div>
              <div class="tech-badge">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/tensorflow/tensorflow-original.svg" alt="TensorFlow"/>
                TensorFlow
              </div>
              <div class="tech-badge">
                <img src="https://cdn.simpleicons.org/pytorch/ee4c2c" alt="PyTorch"/>
                PyTorch
              </div>
              <div class="tech-badge">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/scikitlearn/scikitlearn-original.svg" alt="Scikit-Learn"/>
                Scikit-Learn
              </div>
              <div class="tech-badge">
                <img src="https://cdn.simpleicons.org/powerbi/f2c811" alt="Power BI"/>
                Power BI
              </div>
            </div>
          </div>

          <div class="skill-category-card" style="grid-column: span 2;">
            <div class="category-title">Cloud Infrastructure, Automation &amp; Versioning</div>
            <div class="badge-list">
              <div class="tech-badge">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/amazonwebservices/amazonwebservices-original-wordmark.svg" alt="AWS"/>
                AWS
              </div>
              <div class="tech-badge">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/docker/docker-original.svg" alt="Docker"/>
                Docker
              </div>
              <div class="tech-badge">
                <img src="https://cdn.simpleicons.org/render/46e3b7" alt="Render"/>
                Render
              </div>
              <div class="tech-badge">
                <img src="https://cdn.simpleicons.org/cloudflare/f38020" alt="Cloudflare"/>
                Cloudflare
              </div>
              <div class="tech-badge">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/github/github-original.svg" style="filter: invert(100%)" alt="GitHub"/>
                GitHub
              </div>
              <div class="tech-badge">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/git/git-original.svg" alt="Git"/>
                Git
              </div>
              <div class="tech-badge">
                <img src="https://cdn.simpleicons.org/postman/ff6c37" alt="Postman"/>
                Postman
              </div>
              <div class="tech-badge">
                <img src="https://cdn.simpleicons.org/cmake/064f8a" alt="CMake"/>
                CMake
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </foreignObject>
</svg>
